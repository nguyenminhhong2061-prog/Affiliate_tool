services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-affiliate_db}
      POSTGRES_USER: ${POSTGRES_USER:-affiliate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affiliate_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affiliate_user} -d ${POSTGRES_DB:-affiliate_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: affiliate_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: affiliate_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-affiliate_user}:${POSTGRES_PASSWORD:-affiliate_pass}@postgres:5432/${POSTGRES_DB:-affiliate_db}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      # Thời gian xử lý trung bình 1 job (giây) - dựa trên đo lường thực tế
      AVG_JOB_SECONDS: ${AVG_JOB_SECONDS:-40}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/api/src:/app/src:delegated
      - ./packages/api/session:/app/session:delegated
      - ./packages/api/logs:/app/logs:delegated

volumes:
  postgres_data:
  redis_data:
